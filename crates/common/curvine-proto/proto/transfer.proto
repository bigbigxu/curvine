syntax = "proto2";
package proto;

option java_package = "io.curvine.proto";
option java_multiple_files = true;
option java_outer_classname = "TransferProto";

enum TransferKindProto {
  TRANSFER_LOAD = 1;
  TRANSFER_EXPORT = 2;
}

enum TransferStateProto {
  TRANSFER_PENDING = 1;
  TRANSFER_PLANNING = 2;
  TRANSFER_DISPATCHING = 3;
  TRANSFER_RUNNING = 4;
  TRANSFER_CANCELING = 5;
  TRANSFER_COMPLETED = 6;
  TRANSFER_FAILED = 7;
  TRANSFER_CANCELED = 8;
  TRANSFER_PARTIAL_SUCCESS = 9;
}

enum TransferTaskStateProto {
  TRANSFER_TASK_PENDING = 1;
  TRANSFER_TASK_RUNNING = 2;
  TRANSFER_TASK_COMPLETED = 3;
  TRANSFER_TASK_FAILED = 4;
  TRANSFER_TASK_CANCELED = 5;
  TRANSFER_TASK_STALE = 6;
}

message TransferProgressProto {
  required int64 loaded_size = 1;
  required int64 total_size = 2;
  required int64 update_time = 3;
  required string message = 4;
}

message TransferTaskStatusProto {
  required string task_id = 1;
  required uint64 attempt_id = 2;
  required string source_path = 3;
  required string target_path = 4;
  required uint32 worker_id = 5;
  required string worker_session_id = 6;
  required TransferTaskStateProto state = 7;
  required TransferProgressProto progress = 8;
  required uint32 retry_count = 9;
  required int64 updated_at = 10;
}

message TransferTaskSummaryProto {
  required uint64 pending = 1;
  required uint64 running = 2;
  required uint64 completed = 3;
  required uint64 failed = 4;
  required uint64 canceled = 5;
  required uint64 stale = 6;
  required int64 completed_size = 7;
}

message TransferJobStatusProto {
  required string job_id = 1;
  required uint64 run_id = 2;
  required TransferKindProto kind = 3;
  required TransferStateProto state = 4;
  required string source_path = 5;
  required string target_path = 6;
  required TransferProgressProto progress = 7;
  required string submitter = 8;
  required string tenant = 9;
  required int64 created_at = 10;
  required int64 updated_at = 11;
  optional string owner = 12;
  optional uint64 fence = 13;
  optional int64 expires_at = 14;
  // Takeovers from a dead owner; non-zero means the job was interrupted.
  optional uint32 takeover_count = 20 [default = 0];
  optional uint64 cv_metadata_epoch = 15;
  // The instance the placement ring assigned this job to, decided once at
  // submit from `hash(client_request_id)` over the configured endpoints.
  optional string placement_addr = 21;
  // The instance currently holding the lease, i.e. actually running it. It
  // differs from `placement_addr` only after a takeover.
  optional string owner_addr = 22;
  // Idempotency key chosen by the submitter; also the placement hash key.
  optional string client_request_id = 23;
  // Bounded job-level retry counters, each with its own reason.
  optional uint32 mount_snapshot_attempts = 24;
  optional uint32 planning_attempts = 25;
  // Submit options recorded with the command.
  optional bool overwrite = 26;
  optional int32 replicas = 27;
}

message SubmitTransferRequest {
  required TransferKindProto kind = 1;
  required string source_path = 2;
  required string target_path = 3;
  required string client_request_id = 4;
  required string submitter = 5;
  required string tenant = 6;
  required bytes command = 7;
  optional uint32 protocol_version = 8 [default = 1];
  // Set by an instance relaying this submit to the job's hash owner. A
  // forwarded submit is always served locally, so the relay is one hop.
  optional bool forwarded = 9 [default = false];
  // Hard job lifetime in milliseconds. 0 (or absent) means "use the service
  // default" (1 day). The deadline is fixed at submit and never extended, not
  // even by a re-plan (CV-105 §3.4).
  optional int64 ttl_ms = 10 [default = 0];
  // Total run budget: the first run plus re-plans after the owner is declared
  // lost. 0 (or absent) means the service default (2).
  optional uint32 max_runs = 11 [default = 0];
}

message SubmitTransferResponse {
  required string job_id = 1;
  required uint64 run_id = 2;
  required TransferStateProto state = 3;
}

message GetTransferStatusRequest {
  required string job_id = 1;
  optional uint32 page_size = 2;
  optional string page_token = 3;
  // Set by an instance relaying to the job's owner. A forwarded request is
  // always answered locally, which bounds relay depth to one hop.
  optional bool forwarded = 4 [default = false];
}

message GetTransferStatusResponse {
  required string job_id = 1;
  required uint64 run_id = 2;
  required TransferStateProto state = 3;
  required TransferProgressProto progress = 4;
  repeated TransferTaskStatusProto tasks = 5;
  optional string next_page_token = 6;
  optional TransferKindProto kind = 7;
  optional string source_path = 8;
  optional string target_path = 9;
  optional string submitter = 10;
  optional string tenant = 11;
  optional int64 created_at = 12;
  optional int64 updated_at = 13;
  optional string owner = 14;
  optional uint64 fence = 15;
  optional int64 expires_at = 16;
  optional uint64 cv_metadata_epoch = 17;
  optional TransferTaskSummaryProto task_summary = 18;
  optional bool task_details_expired = 19;
  // How many times this job was taken over from a dead owner. Non-zero
  // means the job was interrupted and continued on another instance.
  optional uint32 takeover_count = 20 [default = 0];
  optional string placement_addr = 21;
  optional string owner_addr = 22;
  optional string client_request_id = 23;
  optional uint32 mount_snapshot_attempts = 24;
  optional uint32 planning_attempts = 25;
  optional bool overwrite = 26;
  optional int32 replicas = 27;
}

message ListTransfersRequest {
  optional TransferKindProto kind = 1;
  optional TransferStateProto state = 2;
  optional uint32 page_size = 3;
  optional string page_token = 4;
  optional string submitter = 5;
  optional string tenant = 6;
  // When non-empty, selects several states at once (a UI bucket); overrides `state`.
  repeated TransferStateProto states = 7;
}

message TransferStateCountProto {
  required TransferStateProto state = 1;
  required uint64 count = 2;
}

message ListTransfersResponse {
  repeated TransferJobStatusProto jobs = 1;
  optional string next_page_token = 2;
  // Rows matching the request's filters, across all pages.
  optional uint64 total = 3;
  // Per-state counts over the whole store, so the UI's bucket tallies stay global.
  repeated TransferStateCountProto counts = 4;
}

message TransferTenantSummaryProto {
  required string tenant = 1;
  required uint64 pending = 2;
  required uint64 executing = 3;
  required uint64 completed = 4;
  required uint64 failed = 5;
  required uint64 canceled = 6;
  required uint64 total = 7;
  required uint64 partial_success = 8;
}

message ListTransferTenantsRequest {
  optional uint32 page_size = 1;
  optional string page_token = 2;
}

message ListTransferTenantsResponse {
  repeated TransferTenantSummaryProto tenants = 1;
  optional string next_page_token = 2;
}

message WatchTransferRequest {
  required string job_id = 1;
  optional uint64 since_updated_at = 2;
  optional uint32 page_size = 3;
  optional string page_token = 4;
  // See GetTransferStatusRequest.forwarded.
  optional bool forwarded = 5 [default = false];
}

message WatchTransferResponse {
  required string job_id = 1;
  required uint64 run_id = 2;
  required TransferStateProto state = 3;
  required TransferProgressProto progress = 4;
  repeated TransferTaskStatusProto tasks = 5;
  optional string next_page_token = 6;
  required int64 updated_at = 7;
  required bool changed = 8;
  optional TransferKindProto kind = 9;
  optional string source_path = 10;
  optional string target_path = 11;
  optional string owner = 12;
  optional uint64 fence = 13;
  optional int64 expires_at = 14;
  optional uint64 cv_metadata_epoch = 15;
  optional TransferTaskSummaryProto task_summary = 16;
  optional bool task_details_expired = 17;
}

message CancelTransferRequest {
  required string job_id = 1;
  optional uint64 run_id = 2;
}

message CancelTransferResponse {
  required string job_id = 1;
  required TransferStateProto state = 2;
}

message RetryTransferRequest {
  required string job_id = 1;
}

// One block a segment task wrote, with the workers holding it. Terminal
// reports carry these so the scheduler can commit real block locations when
// finalizing the segmented target file; older workers omit them.
message TaskBlockLocationProto {
  required int64 block_id = 1;
  repeated uint32 worker_ids = 2;
}

message TransferTaskReportRequest {
  required string job_id = 1;
  required uint64 run_id = 2;
  required string task_id = 3;
  required uint64 attempt_id = 4;
  required uint32 worker_id = 5;
  required string worker_session_id = 6;
  required TransferTaskStateProto state = 7;
  required TransferProgressProto progress = 8;
  optional uint32 protocol_version = 9 [default = 1];
  // Worker-side phase markers (ms since epoch, 0 = unknown): task accept
  // time and first source byte time. Used for queue/start/transfer phase
  // breakdown; old workers omit them.
  optional int64 accepted_at_ms = 10;
  optional int64 first_byte_at_ms = 11;
  // Dispatch time of this attempt (ms since epoch, 0 = unknown), echoed from
  // the dispatch request. Phase metrics use it instead of reading the task
  // row; old workers omit it and the service falls back to that read.
  optional int64 attempt_started_at_ms = 12;
  // Segment tasks: blocks written by this attempt (terminal reports only).
  repeated TaskBlockLocationProto block_locations = 13;
}

message TransferTaskReportResponse {
  required bool accepted = 1;
}

// Carries only running progress reports. Terminal task state changes use
// TransferTaskReportRequest so the Worker receives their synchronous result.
message TransferTaskReportBatchRequest {
  repeated TransferTaskReportRequest reports = 1;
  optional uint32 protocol_version = 2 [default = 1];
}

message TransferTaskReportBatchResponse {
  repeated bool accepted = 1;
}

message QueryTransferTaskRequest {
  required string job_id = 1;
  required uint64 run_id = 2;
  required string task_id = 3;
  required uint64 attempt_id = 4;
  required string worker_session_id = 5;
}

message QueryTransferTaskResponse {
  required bool found = 1;
  required TransferTaskStateProto state = 2;
  required TransferProgressProto progress = 3;
  repeated TaskBlockLocationProto block_locations = 4;
}

// ---------------------------------------------------------------------------
// Per-instance service status.
//
// Answers "what is this transfer instance doing right now" for operators. The
// console sends this to every address in the configured `transfer.endpoints`
// list, so that list stays the single source of truth for *which* instances
// exist while each instance answers for itself. Every field is optional and
// additive: an instance that predates this RPC simply fails the call, and the
// console reports it as unreachable instead of guessing from metrics.
// ---------------------------------------------------------------------------
message GetTransferServiceInfoRequest {}

message TransferServiceInfoResponse {
  // Always "transfer", so a mixed fleet proves the answer came from the right role.
  optional string role = 1;
  // Process-unique lease owner id: changes on restart, unlike the address.
  optional string instance_id = 2;
  // This instance's rpc address (`hostname:rpc_port`) — the value the ring holds.
  optional string addr = 3;
  // This instance's web address (`hostname:web_port`), where /metrics and /healthz live.
  optional string web_addr = 4;
  optional string version = 5;
  optional string version_commit = 6;
  optional int64 start_time_ms = 7;
  optional int64 uptime_ms = 8;
  optional bool ready = 9;
  // `normal` | `degraded` | `not_ready`; `state_reason` says why.
  optional string state = 10;
  optional string state_reason = 11;
  optional string store_backend = 12;
  // Dispatch ceilings currently in effect (runtime-overridable, not the file value).
  optional uint64 max_running_transfers = 13;
  optional uint64 worker_task_limit = 14;
  optional uint64 max_tasks_per_transfer = 15;
  optional uint64 max_plan_entries = 16;
  // Store-wide job counts: identical on every instance that shares the store.
  optional uint64 active_jobs = 17;
  optional uint64 executing_jobs = 18;
  // Jobs whose file-level task state lives in this process: this instance's load.
  optional uint64 in_memory_jobs = 19;
  optional uint64 in_memory_running_tasks = 20;
  // Health of the master-derived worker/mount snapshot this instance plans from.
  optional uint64 snapshot_version = 21;
  optional int64 snapshot_updated_at = 22;
  optional int64 snapshot_staleness_ms = 23;
  optional uint64 snapshot_live_workers = 24;
  optional uint64 snapshot_capable_workers = 25;
  // The placement ring this instance is using, so a drifted config is visible.
  optional string ring_self = 26;
  repeated string ring_members = 27;
  // Whether this instance accepts new submissions (`accept_jobs`). False means
  // the service is up but closing to new work: in-flight jobs keep running.
  optional bool accepts_jobs = 28;
}
