syntax = "proto2";
package proto;

option java_package = "io.curvine.proto";
option java_multiple_files = true;
option java_outer_classname = "JournalProto";

import "common.proto";
import "master.proto";
import "mount.proto";

// Journal batch payload written by the master into the raft log.
//
// Heavy inode metadata (InodeDir/InodeFile/InodeView/BlockMeta) is kept
// opaque: each such field carries one curvine-codec record (see the crate
// docs in crates/common/curvine-codec/src/lib.rs) so the wire format of the
// master metadata stays independent from this envelope. Scalar operation
// parameters and the shared model messages keep native protobuf fields.
message JournalBatchProto {
    required uint64 seq_id = 1;
    repeated JournalEntryProto batch = 2;
}

message JournalEntryProto {
    oneof entry {
        MkdirEntryProto mkdir = 1;
        CreateFileEntryProto create_file = 2;
        ReopenFileEntryProto reopen_file = 3;
        OverWriteFileEntryProto overwrite_file = 4;
        AddBlockEntryProto add_block = 5;
        CompleteFileEntryProto complete_file = 6;
        RenameEntryProto rename = 7;
        DeleteEntryProto delete = 8;
        MountEntryProto mount = 9;
        UnMountEntryProto unmount = 10;
        SetAttrEntryProto set_attr = 11;
        SymlinkEntryProto symlink = 12;
        LinkEntryProto link = 13;
        SetLocksEntryProto set_locks = 14;
        FreeEntryProto free = 15;
        UfsAppliedEntryProto ufs_applied = 16;
        SnapshotEntryProto snapshot = 17;
        CacheInvalidationEntryProto cache_invalidation = 18;
        UfsDeferredEntryProto ufs_deferred = 19;
        TrashPurgeEntryProto trash_purge = 20;
        WorkerIntentEntryProto worker_intent = 21;
        ReleaseWriterEntryProto release_writer = 22;
        // CV-70: block locations are journaled, so a promoted follower serves
        // the location set the previous leader actually applied.
        BlockLocationDeltaEntryProto block_location_delta = 23;
        WorkerLocationPurgeEntryProto worker_location_purge = 24;
    }
}

message ReleaseWriterEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required int64 ino = 3;
    required string client = 4;
}

message MkdirEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required string path = 3;
    // curvine-codec record of InodeDir.
    required bytes dir = 4;
}

message CreateFileEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required string path = 3;
    // curvine-codec record of InodeFile.
    required bytes file = 4;
}

message ReopenFileEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required string path = 3;
    // curvine-codec record of InodeFile.
    required bytes file = 4;
}

message OverWriteFileEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required string path = 3;
    // curvine-codec record of InodeFile.
    required bytes file = 4;
}

message AddBlockEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required string path = 3;
    // curvine-codec record of Vec<BlockMeta>.
    required bytes blocks = 4;
    repeated CommitBlockProto commit_block = 5;
}

message CompleteFileEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required string path = 3;
    // curvine-codec record of InodeFile.
    required bytes file = 4;
    repeated CommitBlockProto commit_blocks = 5;
}

message RenameEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required string src = 3;
    required string dst = 4;
    required int64 mtime = 5;
    required uint32 flags = 6;
    // Pre-exchange inode ids for idempotent EXCHANGE replay.
    optional int64 src_inode_id = 7 [default = 0];
    optional int64 dst_inode_id = 8 [default = 0];
}

message DeleteEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required string path = 3;
    required int64 mtime = 4;
}

message MountEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required MountInfoProto info = 3;
}

message UnMountEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required uint32 id = 3;
}

message SetAttrEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required string path = 3;
    required SetAttrOptsProto opts = 4;
}

message SymlinkEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required string link = 3;
    // curvine-codec record of InodeFile.
    required bytes new_inode = 4;
    required bool force = 5;
}

message LinkEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required int64 mtime = 3;
    required string src_path = 4;
    required string dst_path = 5;
}

message SetLocksEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required int64 ino = 3;
    repeated FileLockProto locks = 4;
}

message FreeEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required string path = 3;
    required int64 mtime = 4;
    optional bool recursive = 5 [default = false];
}

message CacheInvalidationEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    // curvine-codec record of Vec<InodeView>.
    required bytes inodes = 3;
}

message UfsAppliedEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required uint64 term = 3;
    required uint64 index = 4;
}

message UfsDeferredEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required uint64 term = 3;
    required uint64 index = 4;
    required string error = 5;
    // JournalBatchProto of the UFS ops copied out of the raft log.
    required bytes payload = 6;
}

message SnapshotEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required uint64 node_id = 3;
    required string dir = 4;
}

message WorkerIntentEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required string host = 3;
    // AdminState::as_str_name of the intent; "Normal" clears the record.
    required string admin = 4;
    required int64 since_ms = 5;
    required string operator = 6;
    required string reason = 7;
    required int64 drain_deadline_ms = 8;
    // Orphan block ids left behind by a forced completion. Bounded sample:
    // `orphan_count` is authoritative, the list keeps alerting actionable.
    repeated int64 orphan_blocks = 9;
    optional uint64 orphan_count = 10 [default = 0];
    optional int64 forced_at_ms = 11 [default = 0];
    // Impact preflight computed when the drain started.
    optional uint64 preflight_blocks = 12 [default = 0];
    optional uint64 preflight_single_replica = 13 [default = 0];
}

message TrashPurgeEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required string entry = 3;
    required int64 mtime = 4;
    repeated string paths = 5;
}

// One block-location add or remove.
message BlockLocationOpProto {
    required int64 block_id = 1;
    required uint32 worker_id = 2;
    // Only meaningful for `add`; `del` ignores it.
    optional StorageTypeProto storage_type = 3 [default = STORAGE_TYPE_PROTO_DISK];
}

// A block-location delta the leader already applied.
//
// Upgrade note: a master that predates this entry cannot decode it (prost drops
// the unknown oneof tag, so the payload fails to parse and the batch is refused
// unless `ignore_reply_error` skips it). Roll the whole raft group at once; a
// node-by-node upgrade needs every master on this build beforehand.
//
// The entry carries the *result*, never an intent: the leader decides under the
// filesystem write lock whether a replica add is accepted (block still exists,
// not already recorded, below the replica target) and only then journals the
// accepted operations. A follower replays them as plain set operations inside
// the same critical section, so it never re-decides and never diverges.
message BlockLocationDeltaEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    repeated BlockLocationOpProto add = 3;
    repeated BlockLocationOpProto del = 4;
}

// Drops every location of one worker (lost, force-retired, decommissioned).
//
// The block ids are not enumerated: a worker can hold hundreds of thousands of
// blocks, so replaying the purge as a per-block list would bloat the journal.
// The follower runs the same `(worker_id, block_id)` prefix scan the leader did,
// which is deterministic and idempotent.
message WorkerLocationPurgeEntryProto {
    required uint64 op_id = 1;
    required int64 rpc_id = 2;
    required uint32 worker_id = 3;
}
