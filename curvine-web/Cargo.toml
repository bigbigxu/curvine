[package]
name = "curvine-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Curvine web server."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
curvine-core-error = { workspace = true }
curvine-runtime = { workspace = true }
curvine-rpc = { workspace = true }
curvine-net = { workspace = true }
curvine-config = { workspace = true }
curvine-profiling = { workspace = true }
curvine-model = { workspace = true }
curvine-raft = { workspace = true }
curvine-sys = { workspace = true }
curvine-fs-api = { workspace = true }
curvine-job-client = { workspace = true }
# Only for `FsContext`: the transfer status probe pins one client per configured
# endpoint, and the cluster contexts hold an `FsContext`, not a `Runtime`.
curvine-client-core = { workspace = true }
curvine-unified-fs = { workspace = true, features = ["opendal-s3"] }
curvine-proto = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
# Next builds curvine-web in the client-safe cargo profile (without
# curvine-server). Community #1290 gates FsError:IntoResponse behind
# curvine-error/axum-response, which server enables; web must enable it
# itself so Handler bounds resolve under the split build.
curvine-error = { workspace = true, features = ["axum-response"] }
log = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "fs", "cors"] }
serde_json = { workspace = true }
serde = { version = "1.0.216", features = ["derive"] }
clap = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
futures = { workspace = true }
# CIVI AI assistant: the agent loop is written as an async generator.
async-stream = { workspace = true }
# The CIVI tool provider is dyn-dispatched and async (console tools reach
# imported clusters over RPC).
async-trait = { workspace = true }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }

[features]
# Forwards to the sampler crate: without it the route is never mounted.
profiling = ["curvine-profiling/profiling"]
# Heap profile: needs the jemalloc sampling build plus the conversion crate.
memory-profiling = ["curvine-profiling/memory-profiling"]
